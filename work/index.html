      <p class="label eyebrow">Selected work</p>
      <h1>Thirty one people who were easier to respect than to <em>find</em>.</h1>
      <p class="lede">Personal brand websites for professionals with a real record and no place online that shows it. Client names stay private unless they ask otherwise.</p>
    </div>

    <main>

      <section>
        <h2>Thirty one sites, one problem</h2>
        <p>Every one of them was built for the same situation. Someone with a real record, decades of it in some cases, whose online presence had fallen years behind. A profile on a directory they do not control. A practice page written by somebody else. Nothing that says, in their own words, what they actually do.</p>
        <p>The clients are physicians, attorneys, academics and executives. I do not publish their names or link their sites here. Most of them came to me precisely because they did not want to be a marketing example, and that does not stop being true once the work is finished.</p>
        <p>If you want to see finished work before you commit, ask me and I will send examples directly, with the client's permission.</p>
      </section>

      <section>
        <h2>What gets built</h2>
        <div class="grid">
          <div class="card"><h3>A site under your own name</h3><p>Your domain, your record, not a profile on a platform that can change its rules or disappear.</p></div>
          <div class="card"><h3>The biography done properly</h3><p>Written from what you have actually done, in language a person outside your field can follow.</p></div>
          <div class="card"><h3>Structured for machines</h3><p>Markup that tells search engines and AI assistants who you are, so they stop guessing.</p></div>
          <div class="card"><h3>Fast and legible on a phone</h3><p>Most people who search your name are holding a phone. That is the version that has to work.</p></div>
        </div>
      </section>

      <section>
        <h2>Levels</h2>
        <p>There are three engagements, and they differ in how much of your record gets built out rather than in quality of build. The full list of deliverables and current pricing is on the <a href="/#engagements">engagements section of the home page</a>.</p>
        <p>If you are not sure which fits, say what you have and what you want represented, and I will tell you which one I would pick. Including when the answer is the cheapest one.</p>
